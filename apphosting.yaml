# Firebase App Hosting configuration.
# Docs: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Public Firebase config (available in the browser)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyDr6WFwnN0ZG7q0iwl4TlzW5ZfDJ87ukXA"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "carter-a645e.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "carter-a645e"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:133114466249:web:4c7d67348e5e754229a218"
    availability:
      - BUILD
      - RUNTIME

  # Secrets — set via `firebase apphosting:secrets:set <NAME>` and reference here.
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
  - variable: FIREBASE_SERVICE_ACCOUNT_B64
    secret: FIREBASE_SERVICE_ACCOUNT_B64
  - variable: ELEVENLABS_API_KEY
    secret: ELEVENLABS_API_KEY
